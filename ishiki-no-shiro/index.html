<script>
const CONF = {"mode": "preview", "lang": "ja", "img": "images/"};
const ESSAY = {"ja": {"title": "布の意識／無意識と「白」", "author": "原瑠璃彦", "blocks": [{"t": "h", "v": "1"}, {"t": "p", "v": "「白」とは、「はじまり」にして「終り」であり、生でもあり死でもある。それはwhiteとは異なり、「自然のまま」「素」としての色彩であり、いわゆるタブラ・ラサのようなものとは微妙に異なる。何も手がつけられていない真っさらな「白」がある一方で、ここに並べられている大麻・苧麻の布のように、時間を経たがゆえの「白」もある。それらは時間に晒されることによって、より白く、またより柔らかくなってゆく。"}, {"t": "p", "v": "吉田真一郎は、かつては絵画において、やがて古布を通して「白」を追求してきた。吉田は、何の文様もない、また、何も描かれていない無地の布にこだわる。"}, {"t": "p", "v": "吉田は、しばしば無意識について語る。5年前に制作したインタビュー本『吉田真一郎｜白の気配』でも「俺はただこういう形をしてる受付のおっさんで、本当に俺を成り立たせてるのは未知なものや」と語っている。"}, {"t": "p", "v": "彼が追求する「白」は、無意識、さらには夢の世界にも通じており、そこには吉田が幼少時代に生き別れた亡き母の記憶の影がある。"}, {"t": "p", "v": "また、吉田自身、これらの白布を決して意識的に集めたわけでもなく、ましてや《白》の作品を当初から狙って蒐集したわけでもない。作品《白》は、思いがけず偶然に生まれたものであった（『吉田真一郎｜白の気配』参照）。吉田は、<span class=\"em-dot\">何とはなしに</span>、これらのアーカイヴを集めたのである。《白》とは、吉田自身の無意識の産物でもある。"}, {"t": "h", "v": "2"}, {"t": "p", "v": "作品《白》において、その白い無地の布にはさまざまな無意識が託されている。"}, {"t": "p", "v": "人間にとっての無意識が布であるならば、それは、逆に布にとっての意識なのかもしれない。しかし、布の意識／無意識は、個人的なものではなく、より集合的なものである。しかもその集合性・複数性は、同時代にとどまらず、過去、さらには未来にも接続している。それゆえ、それは布の共時的かつ通時的意識／無意識と呼んでも良いだろう。要するにそれはフロイト的な無意識というよりも、むしろユング的な無意識である。"}, {"t": "p", "v": "吉田における「白」、古布の問題を追っていると、それは吉田という個人の問題―すなわち「受付のおっさん」―に奥深く通じているが、それと同時に、日本における「白」、さらには世界における共生といった問題へとおのずと接続してゆく。"}, {"t": "p", "v": "白い古布は、さらには仏教の唯識思想における阿頼耶識にまで通じている可能性がある。"}, {"t": "p", "v": "阿頼耶識は、いわゆる八識のうち最後に数えられる。八識とは、前五識（眼識・耳識・鼻識・舌識・身識）つまり五感に加え、第六の意識、第七の末那識―意識のない状態でも絶えず存在し、自己にこだわる煩悩の根源でもある―、そして第八の阿頼耶識のことを言う。阿頼耶識の概念はきわめて複雑だが、それは個人ないし集団の意識／無意識のレベルにとどまるものではなく、宇宙万有の展開の根元とされる。"}, {"t": "p", "v": "阿頼耶識には、その性質ゆえ、さまざまな呼称があり、常に万有を支え保っているために「無没識」、万有を蔵するために「蔵識」とも呼ばれる。なかでも注目されるのは「種子識」で、これは、阿頼耶識に万有発生の種子が蔵されているがゆえの呼称である。その種子には、身体や口によって発された行動や、心に起こった思念が、残り香のようにして残留するという。このことは、香気が衣服に沁み込み、やがてはその衣服自体が香気を放つことになぞらえられ、薫習と呼ばれる。そして、薫習された種子は、また新たな行動や思念を生じる要因ともなる。つまり、阿頼耶識に蔵される種子には、ある種、アーカイヴとしての記録機能があり、それがまた新たな行動・思念を生み出す。"}, {"t": "p", "v": "作品《白》の理想とは、並べられた種々の白い麻布の意識／無意識と、その前に佇む人々の意識／無意識がともに白くなり、融通無碍になる状態ではないだろうか。実体としての白い麻布は、人の無意識どころか、究極的にはこうした万物の根元たる阿頼耶識にまで通じているように思われる。"}, {"t": "h", "v": "3"}, {"t": "p", "v": "今回展示されるヘソ巻は、麻糸を球状に巻きつけたものであるが、その歴史は古く、すでに『古事記』や『万葉集』にその語が見える。以下は『古事記』の一節である。"}, {"t": "q", "v": "赤き土を以て床の前に散し、へそ（閉蘇）の紡麻を以て針に貫き、其の衣の襴に刺せ"}, {"t": "p", "v": "これは、奈良・桜井の三輪山伝説において、夜毎に女のもとに通う男が誰であるかを突き止めるため麻糸をその男の衣の裾に刺すという、女の両親の入れ知恵の言葉である。女がその糸を辿ってゆくと、三輪山の神社、すなわち今日の大神神社に至り、男が三輪の神であったことを知る。この糸については、しばしばギリシア神話において、王女アリアドネが英雄テーセウスを迷宮ラビリントスから救うときに用いた「導きの糸」との類似が説かれる。ヘソ巻の糸とは、このように、何か捉え難いものを繋ぎ止める道具でもあり、神に通じるものでもあった。"}, {"t": "p", "v": "「へそ」は、のちには苧環とも呼ばれ、しばしば和歌にも詠まれた。有名なのは『伊勢物語』に見える次の和歌である。"}, {"t": "q", "v": "いにしへの倭文の苧環くりかへし昔を今になすよしもがな"}, {"t": "p", "v": "倭文とは、古代に織られたと伝えられる日本風の織物である。その素材は麻とも楮とも言われ、謎に包まれている。それを織るための糸を球状に巻きつけたものが苧環である。上の和歌において「いにしへの」と詠まれているように、平安時代前期において、すでに古いものとされていた。ここでは、それを「繰り返す」ことによって、ちょうどテープを巻き戻すようにして、過去を今に戻す手立てが欲しい、というやるせない恋の思いが歌われている。"}, {"t": "p", "v": "へそ＝苧環とは、時間を巻きつけたものであり、言わば、時間の起源である。その一本一本の糸＝時間は、均一に流れておらず、微妙に揺れ動いている。無論、それは手で績まれた糸であり、それを一本一本、また手によって経糸・緯糸として交差させることで白い布が織られる。そのとき、その一本一本の糸＝時間の固有性によって、その布自体から、吉田の言う「気配」が醸し出される。"}, {"t": "h", "v": "4"}, {"t": "p", "v": "ここに展示されている布、ヘソ巻たちは、吉田真一郎の所蔵する膨大なアーカイヴの一部に過ぎない。吉田は、いまやいかなる公共博物館も所蔵していないような古布のアーカイヴを膨大に所蔵しており、その数は千を超える。これらはいずれも吉田が各地の骨董屋を通じて自身で蒐集したもので、現在、京都府福知山市の吉田の実家に安置されている。"}, {"t": "p", "v": "その布たちは往古の人々の手を経てつくられ、そして、また、代々の人々に用いられたものである。これらは古さゆえに経年変化の跡をとどめているが、しかし、不思議なことに、汚さのようなものは全くなく、また不吉な気配も感じられない。そこに故人の怨念のようなものも憑いておらず、また、<span class=\"em-dot\">重さ</span>のようなものもなく、軽やかな出立をしている。むしろそれは時間に晒されたがゆえなのか、いくぶん垢抜けた顔つきをしている。"}, {"t": "p", "v": "これらのアーカイヴの多くは無地であり、決して主張の強い織物ではない。しかし、彼らは言わば自足しており、何の不満もなく存在しているように見える。ある種、彼らは成仏を遂げた布なのかもしれない。"}, {"t": "p", "v": "これらの布を、吉田は決して無造作に蒐集したわけではない。先述の通り、それは吉田が無意識的に買い集めたものであるが、しかし、そこには吉田のセンスによる選別がある。吉田は、これらの古布たちの理想的な意識／無意識を嗅ぎ取っていたように思われる。「白」とは、単に眼に見える布の様相の問題にとどまらず、布の内面にも関わる問題のようである。"}, {"t": "p", "v": "吉田のアーカイヴたちは、言わば、歴史そのものの薫習を帯びている。そこに蓄積された先人たちの残り香は、一見、何も主張しないようでいながら、無言のまま雄弁な語りを秘めており、その前に佇んでいると、そのざわめきのようなものが聴こえてくる。彼らは私たちの無意識に語りかけているのだろうか。それは、何とはなしに、私たちの新たな行動と思念について、未来への問いかけを放っているようである。"}]}, "en": {"title": "The Consciousness/Unconscious of Fabric and <em>Shiro</em>", "author": "Rurihiko Hara", "blocks": [{"t": "h", "v": "1"}, {"t": "p", "v": "<em>Shiro</em> (white) is at once the beginning and the end, both life and death. Unlike the English “white,” <em>shiro</em> denotes a color in its natural or raw state, subtly distinct from what is commonly referred to as a <em>tabula rasa</em>. There is a <em>shiro</em> that is pristine and untouched, and another that emerges with the passage of time, as seen in the hemp and ramie fabrics on view here. As time passes, they become whiter and softer."}, {"t": "p", "v": "Shinichiro Yoshida initially explored <em>shiro</em> through painting before eventually turning to old fabrics. He insists on plain fabrics, without patterns or designs."}, {"t": "p", "v": "Yoshida often talks about the unconscious. In the interview book <em>Shinichiro Yoshida: the existence of white</em>, produced five years ago, he remarked: “I’m just the guy at the front desk. What makes me who I am is something unknown.”"}, {"t": "p", "v": "The <em>shiro</em> he pursues is connected to the unconscious and even to the world of dreams, shadowed by memories of his late mother, from whom he was separated in childhood."}, {"t": "p", "v": "Also, Yoshida did not consciously set out to collect these <em>shiro</em> fabrics, nor did he initially intend to use them to create the <em>White</em> series. The work <em>White</em> [<em>Shiro</em>] came about unexpectedly and by chance (see <em>Shinichiro Yoshida: the existence of white</em>). Yoshida amassed this archive without conscious thought. <em>White</em> is also a product of his own unconscious."}, {"t": "h", "v": "2"}, {"t": "p", "v": "In <em>White</em>, the plain, <em>shiro</em> fabric becomes a vessel for the many facets of the unconscious."}, {"t": "p", "v": "If the unconscious is like fabric to humans, then perhaps, conversely, it is like the consciousness to fabric. However, the consciousness/unconscious of fabric is not individual but collective. Moreover, this collective and plural nature extends beyond the present, connecting with the past and even with the future. Therefore, it could be called the synchronic and diachronic consciousness/unconscious of fabric. In short, it is closer to the Jungian than the Freudian conception of the unconscious."}, {"t": "p", "v": "A closer examination of <em>shiro</em> and old fabrics in Yoshida’s work reveals their deep connection to him as an individual, or, in his own words, “the guy at the front desk.” At the same time, it naturally opens onto broader questions, from the meaning of <em>shiro</em> in Japan to the possibility of coexistence on a global scale."}, {"t": "p", "v": "The old fabric of <em>shiro</em> may even be linked to the <em>ālaya-vijñāna</em> in Buddhist <em>Yogācāra</em> philosophy."}, {"t": "p", "v": "The <em>ālaya-vijñāna</em> is the last of the so-called Eight Consciousnesses (<em>aṣṭa vijñāna</em>). These comprise the five sense consciousnesses (<em>pañca vijñānāni</em>: five senses, visual, auditory, olfactory, gustatory, and tactile); the sixth consciousness (<em>mano-vijñāna</em>); the seventh, the <em>manas</em> consciousness (<em>kliṣṭa-manas</em>), which operates continuously, even in states of unconsciousness, and is the root of the defilements (<em>kleśa</em>) arising from attachment to the self (<em>ātma-grāha</em>); and the eighth, the <em>ālaya-vijñāna</em>. Although the concept of the <em>ālaya-vijñāna</em> is highly complex, it extends beyond the consciousness/unconscious of individuals and groups, serving as the ground from which all phenomena in the universe arise."}, {"t": "p", "v": "The <em>ālaya-vijñāna</em> is known by several names that reflect its different functions. It is called the “Unceasing Consciousness” (<em>anivṛtti-vijñāna</em>) because it continuously sustains and preserves all things, and the “Storehouse Consciousness” (<em>ālaya-vijñāna</em>) because it retains them all. Of particular note is the “Seed Consciousness” (<em>bīja-vijñāna</em>), a term that reflects the <em>ālaya-vijñāna</em>’s role as the repository of the seeds that generate all phenomena in the universe. Those seeds are said to retain the imprint of actions performed by the body or mouth, as well as thoughts arising in the mind, much like a scent that lingers. This is compared to the way a fragrance permeates a piece of cloth until the cloth itself comes to emit the scent, a process known as <em>vāsanā</em>. Seeds imprinted through <em>vāsanā</em> in turn give rise to new actions and thoughts. In other words, the seeds stored in the <em>ālaya-vijñāna</em> function as a kind of archive, generating new behaviors and ideas in turn."}, {"t": "p", "v": "Does the work <em>White</em> not aspire to a state in which the consciousness/unconscious of the various <em>shiro</em> bast-fiber fabrics arranged in a row and the consciousness/unconscious of the visitors standing before them both become <em>shiro</em>, flowing into one another without obstruction? The substance of these bast-fiber <em>shiro</em> fabrics seems to be connected not only to the human unconscious but ultimately to the <em>ālaya-vijñāna</em>, the root of all things."}, {"t": "h", "v": "3"}, {"t": "p", "v": "The <em>heso-maki</em> on view here are made by winding hemp thread into a spherical form. The term has a long history, appearing as early as the <em>Kojiki</em> and the <em>Man’yōshū</em>. The following passage is drawn from the <em>Kojiki</em>."}, {"t": "q", "v": "Scatter red clay by your bed. Thread a needle with a bundle [<em>heso</em>] of hemp yarn and sew it onto the hem of his robe.<sup>1</sup>"}, {"t": "p", "v": "The quote comes from the legend of Mount Miwa in Sakurai, Nara, in which a woman’s parents advise her to sew a strand of hemp thread into the hem of the garment worn by the man who visits her each night, in order to discover his identity. Following the thread, the woman arrives at the shrine on Mount Miwa, now known as Ōmiwa Shrine, where she learns that her mysterious visitor is none other than the god of Miwa. Regarding this strand, parallels are often drawn with the “guiding thread” with which Princess Ariadne helps Theseus escape the Labyrinth in Greek mythology. In this way, the yarn of the <em>heso-maki</em> became both a means of grasping the elusive and a thread connecting the human and the divine."}, {"t": "p", "v": "<em>Heso</em>, later also referred to as <em>odamaki</em>, appears frequently in <em>waka</em> poetry, including the following well-known example from <em>The Tales of Ise</em>."}, {"t": "q", "v": "<em>Inishie no shizu no odamaki kuri kaeshi<br>mukashi wo ima ni nasu yoshi mo gana</em><br><br>(As in times gone by<br>the weaver of hempen cloth [<em>shizu</em>]<br>unwound her hand skein [<em>odamaki</em>],<br>ah, that we might find a way<br>to turn those days back to now!)<sup>2</sup>"}, {"t": "p", "v": "<em>Shizu</em> refers to a type of Japanese textile said to have been woven in ancient times. The material is thought to be either bast or <em>kōzo</em> (paper mulberry) fiber, but its exact nature remains shrouded in mystery. An <em>odamaki</em> is a ball of thread wound to weave the textile. The expression “in times gone by” in the <em>waka</em> suggests that <em>shizu</em> was already regarded as ancient in the early Heian period [late eighth to early ninth century]. The poem gives voice to a lover’s poignant longing for a way to turn back time, as one might rewind a tape or unwind an <em>odamaki</em>."}, {"t": "p", "v": "The <em>heso-maki</em> = <em>odamaki</em> is an object around which time itself is wound, the very origin of time, so to speak. Each of its threads, each strand of time, fluctuates ever so slightly rather than flowing uniformly. Of course, these yarns are made by hand through a process called <em>umi</em>. They are then interwoven, one by one, as warp and weft to create the fabric of <em>shiro</em>. At that moment, a “presence,” as Yoshida calls it, begins to emanate from the fabric itself through the uniqueness of each individual yarn = strand of time."}, {"t": "h", "v": "4"}, {"t": "p", "v": "The fabrics and <em>heso-maki</em> on view here represent only a small part of Shinichiro Yoshida’s vast archive. His collection comprises more than a thousand pieces of antique fabric, an archive on a scale unparalleled in any public museum. Assembled by the artist himself through antique dealers across Japan, the collection is now housed at his family home in Fukuchiyama, Kyoto Prefecture."}, {"t": "p", "v": "These fabrics were crafted by people long ago and used by successive generations. Although the pieces bear the marks of age, they are strangely free of dirt and carry no hint of foreboding. There is no trace of the dead’s resentment clinging to them, nor do they have any heaviness; they look light. If anything, the passage of time seems to have lent them a more refined physiognomy."}, {"t": "p", "v": "Many of these archival fabrics are plain, with nothing particularly bold or striking about them. They nevertheless seem content simply to be what they are, existing without any dissatisfaction. In a sense, these may be pieces of cloth that have attained Buddhahood, entering a state of spiritual release."}, {"t": "p", "v": "Yoshida certainly did not collect these fabrics haphazardly. As noted earlier, he collected these items almost unconsciously, yet his aesthetic sensibility guided his selection. It seems he was able to sniff out the ideal consciousness/unconscious of these old fabrics. <em>Shiro</em> seems to be a question that extends beyond the fabrics’ mere visual appearance, reaching into their very interiority."}, {"t": "p", "v": "Yoshida’s archives are, so to speak, imprinted with history through <em>vāsanā</em>. The lingering scent of their predecessors has accumulated there. Though at first glance they seem to make no assertions, they conceal a silent yet eloquent narrative. As one stands before them, one begins to hear their murmuring. Are they speaking to our unconscious? They seem to pose questions about the future, about our new actions and thoughts yet to come, almost without conscious thought on their part."}], "notes": ["Ō no Yasumaro, <em>The Kojiki: An Account of Ancient Matters</em>, trans. Gustav Heldt (New York: Columbia University Press, 2014), 85.", "Joshua S. Mostow and Royall Tyler, trans., <em>The Ise Stories: Ise monogatari</em> (Honolulu: University of Hawai‘i Press, 2010), 85."]}};
const D = {"site": {"ja": {"main": "吉田真一郎「意識の白」", "period": "2026年11月6日（金）–2027年3月20日（土）", "venue": "HOSOO GALLERY（京都市中京区柿本町412 HOSOO FLAGSHIP STORE 2F）", "hours": "10:30–18:00（祝日（11月23日、1月11日、2月11日、2月23日）、年末年始（12月29日–1月3日）を除く、入場は閉館の15分前まで）", "admission": "無料", "organizer": "株式会社HOSOO", "credits": "作家：吉田真一郎　キュレーション：井高久美子　リサーチ：原瑠璃彦　空間構成：周防貴之　デザイン・宣伝美術：森田明宏　ディレクション：細尾真孝", "webCredits": "写真：田中恒太郎（拡大写真を除く）　テキスト監修：吉田真一郎", "intro": "HOSOO GALLERYでは、2026年11月6日（金）から2027年3月20日（土）まで、美術家であり、麻布の蒐集家・研究家として知られる吉田真一郎による展覧会「意識の白」を開催いたします。\n\n吉田真一郎は、美術家として活動するなかで、大麻（たいま）・苧麻（ちょま）をはじめとする自然布の蒐集と研究を約40年にわたり続けてきました。2021年には、HOSOO GALLERYにおいて「吉田真一郎｜白の気配」展を開催し、吉田が自身のルーツを模索しながら麻布の蒐集を続けるなかで、約40年の歳月を経て完成させた作品《白》を公開しました。\n\n「白の気配」展で公開した《白》は、すべて同じ平織で織られた大麻繊維の布によって構成されていました。素材も織りの組織も同じでありながら、並べてみると、織りの手加減や糸の撚りの微細な違いが、それぞれの布の気配となって立ち現れるものでした。本展で公開する新たな《白》は、吉田の麻布コレクションを語る上で欠かせない、もう一つの重要な繊維である苧麻を加えて構成されています。古くから日本で栽培されてきた大麻と苧麻の白布を並置することで、日本人がかつてみてきたであろう白の気配を浮かび上がらせ、物をみることとは何かをあらためて問いかけます。\n\nさらに本展では、吉田が蒐集してきた千点以上に及ぶ資料の要素を極限まで削ぎ落とし、構成し直した新作インスタレーションを公開します。この作品は、《白》が持つ布の物質性を超え、「意識」の問題へと問いを深めます。吉田が約40年にわたり麻布を蒐集し、観察し続けるなかで到達した「白」の世界を通して、みることの深層にある意識へと触れていただく機会となれば幸いです。", "tel": "075-221-8888"}, "en": {"main": "Shinichiro Yoshida: The White of Consciousness", "period": "Friday, November 6, 2026–Saturday, March 20, 2027", "venue": "Hosoo Gallery, Hosoo Flagship Store 2F, 412 Kakimoto-cho, Nakagyo-ku, Kyoto", "hours": "10:30 a.m.–6:00 p.m. (Closed on national holidays [November 23, January 11, February 11, and February 23] and during the New Year period [December 29–January 3]; last admission 15 minutes before closing)", "admission": "Free", "organizer": "Hosoo Co., Ltd.", "credits": "Artist: Shinichiro Yoshida / Curator: Kumiko Idaka / Research: Rurihiko Hara / Scenography: Takashi Suo / Promotional design: Akihiro Morita / Director: Masataka Hosoo", "webCredits": "Photo by Kotaro Tanaka (except magnified views) / Text supervision: Shinichiro Yoshida", "intro": "From Friday, November 6, 2026, through Saturday, March 20, 2027, Hosoo Gallery will present The White of Consciousness, an exhibition by Shinichiro Yoshida, an artist known as a collector and researcher of traditional Japanese bast-fiber textiles.\n\nThroughout his career as a visual artist, Yoshida has spent nearly four decades studying and assembling a collection of natural textiles, including those made from hemp and ramie. In 2021, Hosoo Gallery presented Shinichiro Yoshida: The Existence of White, introducing White, a work the artist developed over nearly four decades as he built a collection of bast-fiber fabrics and explored his own roots.\n\nWhite in The Existence of White consisted entirely of hemp fabric woven using the same plain-weave technique. Although the materials and weave structures were identical, subtle variations in weaving tension and yarn twist became apparent when the fabrics were placed side by side, revealing the individual character of each piece. The new version of White in this exhibition incorporates ramie, another essential fiber in understanding Yoshida’s collection. By juxtaposing white cloth made from hemp and ramie, plants cultivated in Japan since ancient times, the work evokes a sense of white that people in this country may have experienced, prompting us to reconsider how we perceive things.\n\nThis exhibition also features a new installation in which Yoshida distills the more than 1,000 items he has collected to their essential elements and reconfigures them. The work moves beyond the materiality of fabric explored in White to delve more deeply into the question of “consciousness.” We hope this exhibition, which offers a glimpse into the world of “white” that Yoshida has gradually arrived at through nearly four decades of collecting and examining bast-fiber textiles, will provide an opportunity to delve into the deeper layers of consciousness that underlie perception.", "tel": "+81-75-221-8888"}}, "works": [{"id": "1", "x": 10.6, "y": 66.5, "materials": ["1"], "ja": {"title": "《白》", "year": "2026年", "material": "大麻布、苧麻布", "period": "江戸末期–明治（1850–1900頃）", "desc": "本作は、江戸時代から明治時代の大麻と苧麻の着物を解いた白布によって構成されている。両繊維が古くから利用されてきたことは、縄文時代の遺跡から出土した編布などから窺い知ることができる。江戸時代に木綿が普及するまで、大麻布と苧麻布は、庶民から上流階級に至るまで広く衣服に用いられてきた。いずれの布も、水に浸し、天日に晒すことを繰り返すことで白くなる。2021年に発表した大麻布のみによって構成された《白》同様、本作も白布を並べた際に立ち現れる気配に主眼を置いている。"}, "en": {"title": "White", "year": "2026", "material": "Hemp and ramie fabrics", "period": "Late Edo to Meiji (c. 1850–1900)", "desc": "This work is composed of white fabric obtained by unstitching hemp and ramie kimonos dating from the Edo and Meiji periods. Archaeological finds from the Jōmon period, including twined fabrics, indicate that both fibers have been used since ancient times. Before cotton became prevalent in the Edo period, hemp and ramie were the principal clothing materials across the social spectrum, from commoners to the upper classes. Both fabrics acquire their whiteness through repeated soaking in water and sun-drying. Like White, Yoshida’s 2021 installation composed entirely of hemp cloth, the present work explores the presence that arises when white cloth is laid out."}}, {"id": "2", "x": 76.3, "y": 66.5, "materials": ["2"], "ja": {"title": "《意識の白》", "year": "2026年", "material": "ヘソ巻（大麻繊維）", "period": "明治末期–昭和初期（1900–1945頃）", "desc": "本作は、明治末期から昭和初期に岩手県、山形県、新潟県周辺でつくられた複数のヘソ巻と、そこから引き出された糸によって構成されている。ヘソ巻とは、績（う）んだ麻糸を、撚りをかける前の状態で、手で幾重にも巻きつけた糸巻束である。「績む」とは、麻の繊維を細く裂き、その端と端を撚りつないで一本の長い糸にする作業を指す。『古事記』などに記述がみられ、ヘソ巻は遅くとも7–8世紀には存在していたと考えられる。績み加減のわずかな差と、長い年月巻かれたまま保管されてきた糸特有の揺らぎが、逆光に照らされることで繊細な気配を生んでいる。"}, "en": {"title": "The White of Consciousness", "year": "2026", "material": "Heso-maki (hemp fiber)", "period": "Late Meiji to Early Shōwa (c. 1900–1945)", "desc": "The present work consists of several heso-maki dating from the late Meiji to early Shōwa periods, originating in and around Iwate, Yamagata, and Niigata Prefectures, as well as threads drawn from them. Heso-maki refers to a bundle of yarn formed by hand-winding yarn made from hemp fibers through the process known as umi, in which the fibers are split into fine strands and joined end to end to form a single, continuous thread. The winding takes place before the resulting yarn is twisted. Descriptions of the practice appear in ancient texts such as the Kojiki, suggesting that heso-maki dates back at least to the seventh or eighth century. Subtle variations in the tension of the umi, together with the slight irregularities of thread wound and stored for many years, lend the work a delicate presence when viewed against the light."}}, {"id": "3", "x": 85.3, "y": 20.8, "materials": ["3-01"], "ja": {"title": "実験の間", "year": "", "material": "", "period": "", "desc": "この部屋では、吉田真一郎が約40年にわたり蒐集してきた資料を厳選し、会期中に入れ替えながら展示を行う。吉田が蒐集し、研究してきた資料は、大麻・苧麻を中心とした江戸時代に各地で生産された上質な着物から、明治から昭和の時代にかけてつくられた野良着や民具に至るまで、繊維の種類、時代、用途を含めて多岐にわたる。吉田が蒐集と研究のなかで発見した一つ一つの要素を検証し、作品に至るまでの試行錯誤の過程そのものを公開していく。資料のアーカイヴ性とアート的思考を往来する実験的な試みとなる。"}, "en": {"title": "Experiment Chamber", "year": "", "material": "", "period": "", "desc": "This gallery presents a carefully curated selection of materials collected by Shinichiro Yoshida over nearly four decades. The exhibits will be changed periodically throughout the exhibition. The materials Yoshida has collected and studied encompass a wide variety of fibers, periods, and uses, ranging from fine kimonos made primarily of ramie and hemp in various regions during the Edo era to work clothes and folk artifacts dating from the Meiji through the Shōwa eras. Each element uncovered through Yoshida’s research and collecting will be examined, revealing the process of trial and error through which his work took shape. This is an experiment that moves between the archival nature of documents and artistic thinking."}}], "materials": {"1": {"groups": ["65"], "topics": ["T02", "T01", "T06", "T13", "T07", "T08"], "ja": {"name": "大麻布、苧麻布", "type": "着物", "fiber": "大麻・苧麻", "period": "江戸末期–明治（1850–1900頃）", "region": "滋賀県", "phase": "", "desc": ""}, "en": {"name": "Hemp and ramie cloth", "type": "Kimono", "fiber": "Hemp, ramie", "period": "Late Edo to Meiji (c. 1850–1900)", "region": "Shiga Prefecture", "phase": "", "desc": ""}, "metaInCaption": true, "zoom": ["Z1"]}, "2": {"groups": ["80"], "topics": ["T11", "T03", "T12", "T04"], "ja": {"name": "ヘソ巻", "type": "糸巻束", "fiber": "大麻", "period": "明治末期–昭和初期（1900–1945頃）", "region": "岩手県、山形県、新潟県周辺", "phase": "", "desc": "ヘソ巻とは、績んだ麻糸を幾重にも巻きつけた糸巻束を指す。上質な糸を繰ることができるようになると余分に収入が得られたことなどから、「ヘソを繰る」が転じて、家計全体のお金とは別に個人的に蓄えるお金のことを「へそくり」と呼ぶようになったとする説がある。"}, "en": {"name": "Heso-maki", "type": "Yarn bundle", "fiber": "Hemp", "period": "Late Meiji to Early Shōwa (c. 1900–1945)", "region": "Iwate, Yamagata, and Niigata Prefectures", "phase": "", "desc": "Heso-maki refers to a bundle of spliced hemp yarn wound in many layers. According to one theory, because those who could reel fine yarn were able to earn extra income, the phrase heso o kuru (to reel heso) gave rise to the word hesokuri, meaning money a person saves privately, apart from the household budget."}, "metaInCaption": ["fiber", "period", "region"]}, "3-01": {"groups": ["54", "55", "56"], "topics": ["T01", "T02", "T03"], "ja": {"name": "オクソザックリ", "type": "野良着", "fiber": "大麻", "period": "明治時代（1868–1912）", "region": "福井県、石川県、岐阜県周辺", "phase": "第1期　2026年11月6日–", "desc": "オクソザックリは、野良着として用いられてきた大麻布の仕事着である。オクソ（苧屑）とは、大麻の苧から粗皮を削り取る際に出る、繊維質の屑のこと。本来は捨てられるものだが、明治時代まで福井県、石川県、岐阜県周辺では、これを緯糸として布を織り、日常の仕事着とした。\n\nそれは、大麻を育て、糸を績み、布を織るまでのすべてを自らの手で担っていた時代の、わずかな繊維も無駄にせず使い切る暮らしの知恵であった。糸そのものによって構成された《意識の白》に対し、オクソザックリは糸づくりの過程で取り除かれた繊維から成る。"}, "en": {"name": "Okuso-zakkuri", "type": "Work garment", "fiber": "Hemp", "period": "Meiji period (1868–1912)", "region": "Fukui, Ishikawa, and Gifu Prefectures", "phase": "Phase 1　From November 6, 2026", "desc": "Okuso-zakkuri is a hemp work garment worn for labor in the fields. Okuso refers to the fibrous waste left when the coarse outer bark is scraped from hemp. Though normally discarded, until the Meiji period it was used as weft in the areas around Fukui, Ishikawa, and Gifu Prefectures, woven into cloth for everyday work clothes.\n\nIt reflects the practical wisdom of an era when people grew the hemp, made the yarn, and wove the cloth entirely by their own hands, using every last fiber. Where The White of Consciousness is composed of yarn itself, okuso-zakkuri is made from the fibers removed in the process of making yarn."}, "metaInCaption": ["fiber", "period", "region"], "zoom": ["Z3"], "refs": ["taiyo"]}}, "topics": {"T01": {"groups": ["64", "45", "69"], "ja": ["大麻とは", "高級な上布から野良着まで", "江戸時代に木綿が普及するまで、大麻布は苧麻布とともに、庶民から上流階級に至るまで幅広く衣服に用いられてきた。繊維が水に強いことから、衣服だけでなく、縄や網、袋など暮らしの道具にも広く使われた。大麻布は、水に浸し、天日に晒すことを繰り返すことで、白く柔らかくなる。"], "en": ["About Hemp", "From Fine Jōfu to Work Clothes", "Until cotton became widespread in the Edo period, hemp cloth, along with ramie, was worn by everyone from commoners to the upper classes. Because the fiber stands up well to water, it was also used for rope, nets, bags, and other everyday tools. Hemp cloth becomes white and soft through repeated soaking in water and bleaching in the sun."], "refs": ["taiyo", "toyokeizai"]}, "T02": {"groups": ["77", "68"], "ja": ["大麻とは", "縄文時代から続く繊維利用の歴史", "日本における大麻の繊維利用の歴史は長く、福井県の鳥浜貝塚（縄文時代草創期–前期）からは、大麻の縄や種子が出土している。オクソザックリがつくられた地域は、この鳥浜貝塚にもほど近い。日本では、大麻に加え、刺草（いらくさ）、苧麻（ちょま）（日本名：カラムシ）などの草木繊維を総称して「麻」と呼び、さまざまな種類の草木が繊維として利用されてきた。\n\n縄文時代の土器に付けられた布の圧痕から、古代から草木繊維を利用した編布がつくられてきたことがわかる。編布は織物とは異なり、経糸を垂直に垂らして緯糸を編んでいく。昭和28年に新潟県で発見されたアンギン（編布）は、土器の圧痕などから縄文時代から続く技法でありながら、近代以降も仕事着などに用いられていた。このようなことから、アンギンは日本の衣服の源流をなすものとして注目を集めている。"], "en": ["About Hemp", "A History of Fiber Use Since the Jōmon Period", "Hemp has a long history of use as a fiber in Japan. Hemp cord and seeds have been excavated at the Torihama Shell Midden in Fukui Prefecture, dating to the Incipient to Early Jōmon period. The region where okuso-zakkuri was made lies not far from this site. In Japan, the term asa is used to collectively refer to plant fibers such as taima (hemp), irakusa (nettle), and choma or karamushi (ramie), and these diverse plants have been used as fibers.\n\nCloth impressions on Jōmon-period earthenware indicate that knitted cloth made of plant fibers was already produced in ancient times. Unlike a woven textile, angin is made by vertically hanging the warp with the weft threaded into it. Angin (knitted cloth), discovered in Niigata Prefecture in 1953, is a technique used since the Jōmon period, as evidenced by the impressions on earthenware from the era, yet it was still used for work clothes in modern times. For these reasons, the fabric is known as the origin of Japanese clothing."], "refs": ["nunome", "okuyama", "kudo", "wakasa", "ichihara"]}, "T03": {"groups": ["47"], "ja": ["大麻とは", "苧と苧引き", "カナビキ（苧引き刀）は、大麻の皮の粗皮を削り取る際に用いる道具。苧引き板と呼ばれる板に、一枚ずつ皮の内側が上になるように置き、粗皮をカナビキで削り取っていく。粗皮を削り取った皮を日陰にて乾燥させることで苧ができる。削り取られた部分もオクソ（苧屑）として繊維利用される。"], "en": ["About Hemp", "O and O-hiki", "Kanabiki is a tool used to scrape coarse parts off hemp bark. The bark is placed on a board called o-hiki ita with the inside of each piece facing up, and the coarse parts are peeled off using kanabiki. The bark is then dried in the shade, turning into o. The scraped fibrous waste is also used as fiber material called okuso."], "refs": ["yumeore"]}, "T04": {"groups": ["02"], "ja": ["大麻とは", "神道の信仰と深く結びつく大麻", "大麻の茎の皮から粗皮を剥いだものを「苧」と呼ぶ。この大麻の苧は、現代でも群馬県岩島地区で栽培されているもので、天皇即位の儀式で着用される装束や神宮の祭祀に用いられている。大麻は、日本では神聖な植物として、神道の信仰において欠かすことができない草木繊維でもある。"], "en": ["About Hemp", "Hemp and Shinto Belief", "O is hemp stem bark with coarse parts peeled off. This hemp o is still produced today in the Iwashima area of Gunma Prefecture and is used for costumes worn at the accession ceremony of the emperor and for rituals at Shinto shrines. Hemp is a sacred plant in Japan and an essential plant fiber in Shinto beliefs."], "refs": ["yoshinaga"]}, "T05": {"groups": ["26"], "ja": ["大麻とは", "繊維としての大麻の衰退", "この大麻の苧は、大麻取締法が施行され、新聞紙に包まれたまま糸にならなかったと考えられるものである。連合国軍最高司令官総司令部（GHQ）により、昭和23年（1948年）に大麻取締法が施行される。以降、大麻栽培は免許制度へ移行し、国内の生産数が激減した。"], "en": ["About Hemp", "The Decline of Hemp as a Fiber", "This hemp o, hemp stem bark with coarse parts peeled off, is considered to have remained unprocessed, wrapped in newspaper, due to the enforcement of the Cannabis Control Law by the General Headquarters, the Supreme Commander for the Allied Powers, in 1948. Since then, hemp cultivation shifted to a licensing system, and its production in Japan plummeted."], "refs": ["toyokeizai"]}, "T06": {"groups": ["omi"], "ja": ["大麻とは", "幻の大麻布：近江晒（しろ高宮）", "江戸時代の大麻布としては、近江（現在の滋賀県）で生産された近江晒（しろ高宮）が知られる。江戸時代の商品学書、三宅也来『萬金産業袋』（1732）には「和らかきをいとはぬ人のお召地には、是に勝るはあらじ」と記され、その柔らかさが特筆されている。近江晒は長らく実物資料が確認されていなかったが、吉田が着物を解いたところ「南郡曝平大工曲」の朱印が多数見つかり、近江晒の実物資料であることが同定された。また繊維検査により、すべて大麻布であることが明らかになった。"], "en": ["About Hemp", "The Lost Hemp Cloth: Omi-sarashi (Shiro-Takamiya)", "Among the hemp cloths of the Edo period, Omi-sarashi (also called Shiro-Takamiya), produced in Omi Province (present-day Shiga Prefecture), is well known. The Edo-period commercial encyclopedia Mankin sangyo bukuro by Miyake Yarai (1732) singles out its softness: “For those who favor softness, there is no finer cloth for garments.” For many years no actual examples of Omi-sarashi had been confirmed, but when Yoshida unstitched kimono in his collection, he found numerous red seals reading 南郡曝平大工曲, identifying them as Omi-sarashi. Fiber analysis further revealed that all of them are hemp."], "refs": ["bankin"]}, "T07": {"groups": [], "ja": ["苧麻とは", "奈良晒", ""], "en": ["About Ramie", "Nara-sarashi", ""]}, "T08": {"groups": [], "ja": ["苧麻とは", "越後晒", ""], "en": ["About Ramie", "Echigo-sarashi", ""]}, "T11": {"groups": ["81"], "ja": ["大麻とは", "大麻から苧へ", "大麻の苧（お）。大麻は、アサ科の一年生植物で、春先に種を蒔き、夏に引き抜いて茎の部分を繊維として利用する。土地によって繊維を取り出す工程は様々である。例えば岩島では、1週間ほど川に浸した後、釜で煮たものを乾燥させる。その後、1日に加工できる分だけ水に浸し、3日ほどネヤと呼ばれる倉に入れて発酵させ、皮を剥ぎ取る。皮から、さらに粗皮を削り取ったものが苧となる。"], "en": ["About Hemp", "From Hemp Stalk to O", "O is hemp stem bark with coarse parts peeled off. Hemp is an annual plant of the Cannabaceae family. Its seeds are planted in early spring and harvested in summer to use the stems as fiber. The process of extracting the fiber varies from place to place. In Iwashima, for example, the stems are soaked in the river for about a week, then boiled in a cauldron and dried. After that, the stems, in enough amounts for a day of processing, are soaked in water, fermented in a storehouse called neya for three to four days, and then the bark is peeled off. The bark with coarse parts scraped off becomes o."], "refs": ["gunma", "yumeore", "taimahaku"]}, "T12": {"groups": ["40"], "ja": ["大麻とは", "苧績みと苧桶", "苧桶（おぼけ）とは、績んだ麻糸を軽く円環状に重ねながら貯めていく桶のこと。粗皮を削って乾燥させた大麻の苧を指先で細く裂き、裂いたものを撚りながら糸にしていくことを「苧績み」という。苧績みは、主には女性の仕事で、地方によっては苧桶は嫁入り道具であった。室町から同じ形状の苧桶が使われており、大麻取締法が施行された昭和23年まで東北地方を中心に山間部や日本海沿岸部など各地で使われていた。"], "en": ["About Hemp", "O-umi and Oboke", "Oboke is a bucket used for storing spun asa yarn lightly stacked in circles. Dried hemp o is torn with fingertips into fine strips and twisted into yarn. The process is called o-umi. The work was carried out mainly by women; in some regions, the women brought oboke with them when they married. The bucket’s shape remained the same since the Muromachi period, and its use continued in various areas, including the Tohoku region as well as mountainous areas and along the coast of the Sea of Japan, until 1948, when the Cannabis Control Law was enforced."]}, "T13": {"groups": ["26"], "ja": ["大麻とは", "戦後の繊維利用の衰退", "日本の気候風土に適した大麻は、縄文時代から繊維として利用され、長きにわたり各地で盛んに栽培されていた。しかし戦後、連合国軍最高司令官総司令部（GHQ）の占領政策のもとで規制が進められ、昭和23年（1948年）に大麻取締法が施行されると、栽培は免許制へと移行した。さらに、繊維を束のまま裂いて手で績む必要があり、衣料用の糸としては機械化が難しかったことや、化学繊維の普及が重なったことで生産は激減し、日本人の暮らしから大麻布は急速に姿を消していった。"], "en": ["About Hemp", "The Postwar Decline of Hemp Fiber Use", "Well suited to Japan’s climate, hemp had been used as a fiber since the Jōmon period and was widely cultivated across the country for centuries. After the war, however, regulations were introduced under the occupation policy of the General Headquarters, the Supreme Commander for the Allied Powers (GHQ), and with the enforcement of the Cannabis Control Law in 1948, cultivation shifted to a licensing system. Moreover, because the fibers had to be split from the bundle and spliced by hand, hemp yarn for clothing was difficult to mechanize. Together with the spread of synthetic fibers, these factors caused production to plummet, and hemp cloth rapidly disappeared from everyday life in Japan."], "refs": ["toyokeizai"]}}, "groups": {"65": {"files": ["01", "02", "03", "04", "05", "06", "07"], "ja": ["参考：晒布による白い着物（大麻）", "江戸末期–明治（1850–1900頃）", ""], "en": ["Reference: White kimono made of bleached textile (hemp)", "Late Edo to Meiji (c. 1850–1900)", ""]}, "54": {"files": ["01", "02", "04", "05", "11", "12", "13", "14", "15"], "ja": ["オクソザックリ 藍染の襟", "明治時代（1868–1912）", "福井県、石川県、岐阜県周辺"], "en": ["Okuso-zakkuri with indigo-dyed collar", "Meiji period (1868–1912)", "Fukui, Ishikawa, and Gifu Prefectures"]}, "55": {"files": ["01", "02", "04", "05"], "ja": ["未晒しに近い大麻繊維のオクソザックリ", "明治時代（1868–1912）", "福井県、石川県、岐阜県周辺"], "en": ["Okuso-zakkuri of nearly unbleached hemp fiber", "Meiji period (1868–1912)", "Fukui, Ishikawa, and Gifu Prefectures"]}, "56": {"files": ["01", "02", "04", "05"], "ja": ["オクソザックリ 白襟", "明治時代（1868–1912）", "福井県、石川県、岐阜県周辺"], "en": ["Okuso-zakkuri with white collar", "Meiji period (1868–1912)", "Fukui, Ishikawa, and Gifu Prefectures"]}, "80": {"files": ["01", "02", "03", "04", "05"], "ja": ["ヘソ巻", "明治末期–昭和初期（1900–1945頃）", "岩手県、山形県、新潟県周辺"], "en": ["Heso-maki", "Late Meiji to Early Shōwa (c. 1900–1945)", "Iwate, Yamagata, and Niigata Prefectures"]}, "45": {"files": ["01", "04"], "ja": ["魚漁の網", "明治時代（1868–1912）", ""], "en": ["Fishing net", "Meiji period (1868–1912)", ""]}, "77": {"files": ["01", "02"], "ja": ["土器につけられた編布の圧痕", "縄文時代（約15000–3000年前）", ""], "en": ["Angin knitted cloth impressions on unglazed earthenware", "Jōmon period (c. 15,000–3,000 years ago)", ""]}, "68": const EM_TERMS = ['heso-maki','Heso-maki','hesokuri','heso o kuru','heso','umi','o-umi','okuso-zakkuri','Okuso-zakkuri','okuso','Okuso','oboke','Oboke','kanabiki','Kanabiki','o-hiki ita','Kojiki','Omi-sarashi','Shiro-Takamiya','Nara-sarashi','Echigo-sarashi','Echigo-chijimi','Mankin sangyo bukuro','Tsunobukuro','tsunobukuro','Angin','angin','asa','taima','irakusa','choma','karamushi','neya','katabira','o'];
function emEN(s) {
  if (!s) return s;
  const keep = [];
  const hold = h => { keep.push(h); return '\u0000' + (keep.length - 1) + '\u0001'; };
  s = s.replace(/The White of Consciousness|The Existence of White/g, m => hold('<em>' + m + '</em>'));
  s = s.replace(/\bWhite\b/g, m => hold('<em>' + m + '</em>'));
  const terms = EM_TERMS.slice().sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  s = s.replace(new RegExp('(?<![\\w-])(' + terms.join('|') + ')(?![\\w-])', 'g'), m => hold('<em>' + m + '</em>'));
  return s.replace(/\u0000(\d+)\u0001/g, (_, i) => keep[+i]);
}
function rubyJA(s) {
  return s ? s.replace(/大麻（たいま）/g, '<ruby>大麻<rt>たいま</rt></ruby>').replace(/苧麻（ちょま）/g, '<ruby>苧麻<rt>ちょま</rt></ruby>').replace(/績（う）/g, '<ruby>績<rt>う</rt></ruby>').replace(/苧桶（おぼけ）/g, '<ruby>苧桶<rt>おぼけ</rt></ruby>').replace(/苧（お）/g, '<ruby>苧<rt>お</rt></ruby>').replace(/刺草（いらくさ）/g, '<ruby>刺草<rt>いらくさ</rt></ruby>') : s;
}
const fmt = s => lang === 'en' ? emEN(s) : rubyJA(s);
const plain = s => (s || '').replace(/<[^>]+>/g, '');
const circled = n => ({ '1': '①', '2': '②', '3': '③' }[n] || n);

function metaRows(rows) { return rows.filter(r => r[1]).map(([l, v]) => `<div class="meta-row"><span class="meta-label">${l}</span><span class="meta-value">${v}</span></div>`).join(''); }

function carousel(groupIds, key, showMeta = true, metaOverride = null) {
  const t = UI[lang];
  const slides = [];
  groupIds.forEach(g => { const G = D.groups[g]; if (!G) return; G.files.forEach(f => slides.push({ g, f, G })); });
  if (!slides.length) return '';
  const items = slides.map((s, i) => {
    const [name, period, region] = s.G[lang];
    const meta = metaOverride !== null ? metaOverride : [period, region].filter(Boolean).join(lang === 'ja' ? '　' : ' / ');
    const src = `${CONF.img}${s.g}/${s.f}.jpg`;
    return `<figure class="car-slide" data-i="${i}">
      <button class="car-img" type="button" data-full="${src}" aria-label="${plain(name)} ${i + 1}"><img src="${src}" alt="${plain(name)}" loading="${i === 0 ? 'eager' : 'lazy'}"></button>
      <figcaption class="car-cap-src" hidden><span class="car-cap-name">${fmt(name)}</span>${showMeta && meta ? `<span class="car-cap-meta">${meta}</span>` : ''}</figcaption>
    </figure>`;
  }).join('');
  const many = slides.length > 1;
  const dots = many && slides.length <= 16 ? `<span class="car-dots">${slides.map((_, i) => `<button class="car-dot${i === 0 ? ' on' : ''}" type="button" data-go="${i}" aria-label="${t.photo} ${i + 1}"></button>`).join('')}</span>` : '<span class="car-dots"></span>';
  return `<div class="carousel" data-key="${key}">
    <div class="car-track" tabindex="0" aria-label="${t.photo}">${items}</div>
    <div class="car-cap" aria-live="polite"></div>
    ${many ? `<div class="car-ctrl"><button class="car-btn" type="button" data-dir="-1" aria-label="${t.prev}" disabled>‹</button>${dots}<span class="car-count">1 / ${slides.length}</span><button class="car-btn" type="button" data-dir="1" aria-label="${t.next}">›</button></div>` : ''}
  </div>`;
}

const PROFILE = {"ja": {"name": "吉田真一郎", "text": "1948年、京都府生まれ。近世麻布研究所所長。20代から絵画制作を始める。77年に西ドイツへ渡り、現代美術家のヨーゼフ・ボイスに出会い、帰国後、ボイスの影響から古美術や民俗学を独学で勉強し始める。博物館展示を通して、江戸時代の苧麻布、大麻布の繊維と糸の研究を発表。共著に『別冊太陽 日本の自然布』（2004年、平凡社刊）。2018年には、麻布の蒐集と研究が評価され、第6回水木十五堂賞を受賞した。"}, "en": {"name": "Shinichiro Yoshida", "text": "Born in Kyoto Prefecture in 1948, Shinichiro Yoshida is director of the Early Modern Asafu Laboratory. He began painting in his twenties and traveled to West Germany in 1977, where he met the contemporary artist Joseph Beuys. After returning to Japan, he began independently studying antiques and folklore under Beuys’s influence. Through museum exhibitions, he has presented his research on the fibers and yarns of Edo-period ramie and hemp fabrics. His co-authored publications include <em>Bessatsu Taiyo: Nihon no shizenfu</em> [Natural Fabrics of Japan] (Heibonsha, 2004). In 2018, he received the sixth Mizuki Jugodo Prize in recognition of his collection and research on traditional Japanese bast-fiber textiles."}};
function profileHtml() {
  const P = PROFILE[lang] || PROFILE.ja;
  return `<div class="meta-section info profile">
      <p class="section-heading">${lang === 'ja' ? 'プロフィール' : 'Profile'}</p>
      <h2 class="profile-name">${P.name}</h2>
      <p class="fixed-topic-text">${P.text}</p>
    </div>`;
}
function essayHtml() {
  const ja = lang === 'ja'; const ES = ESSAY[lang] || ESSAY.ja;
  const body = ES.blocks.map(b => b.t === 'h' ? `<p class="essay-num">${b.v}</p>` : b.t === 'q' ? `<blockquote class="essay-quote">${b.v}</blockquote>` : `<p class="essay-p">${b.v}</p>`);
  const notes = ES.notes && ES.notes.length ? `<ol class="essay-notes">${ES.notes.map(n => `<li>${n}</li>`).join('')}</ol>` : '';
  const first = body.slice(0, 2).join('');
  const rest = body.slice(2).join('') + notes;
  return `<div class="meta-section info essay">
      <p class="section-heading">${ja ? 'テキスト' : 'Essay'}</p>
      <h2 class="essay-title">${ES.title}</h2>
      <p class="essay-author">${ES.author}</p>
      <div class="essay-body">${first}<div id="essay-more" hidden>${rest}</div></div>
      <button class="more-btn" id="essay-more-btn" type="button" aria-expanded="false" aria-controls="essay-more">${ja ? '続きを読む' : 'Read more'}</button>
    </div>`;
}

function refHtml(keys) {
  if (!keys || !keys.length) return '';
  const items = keys.map(k => D.refs[k]).filter(Boolean).map(r => `<li>${r.replace(/(https?:\/\/[^\s）]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')}</li>`).join('');
  return `<div class="refs"><p class="refs-label">${lang === 'ja' ? '参考文献' : 'References (Japanese sources)'}</p><ul>${items}</ul></div>`;
}

function topicItem(id, t) {
  const tp = D.topics[id]; if (!tp) return '';
  const [, label, body] = tp[lang];
  const pending = !body;
  return `
    <div class="topic-item${pending ? ' pending' : ''}" id="topic-${id}">
      <button class="topic-trigger" type="button" aria-expanded="false"${pending ? ' disabled' : ''}>
        <span class="topic-label">${fmt(label)}</span>
        <span class="topic-arrow">${pending ? `<span class="pending-tag">${t.preparing}</span>` : '＋'}</span>
      </button>
      ${pending ? '' : `<div class="topic-body">${carousel(tp.groups, id)}${paras(body, 'topic-text')}${refHtml(tp.refs)}</div>`}
    </div>`;
}

function renderWork(w, t) {
  const d = w[lang];
  const mats = (w.materials || []).map(mid => {
    const m = D.materials[mid]; if (!m) return '';
    const md = m[lang];
    let lastCat = null;
    const topics = m.topics.map(id => { const tp = D.topics[id]; if (!tp) return '';
      const cat = tp[lang][0];
      const head = cat && cat !== lastCat ? `<p class="topic-group">${cat}</p>` : '';
      lastCat = cat; return head + topicItem(id, t); }).join('');
    return `
      <article class="material">
        ${md.phase ? `<p class="phase-tag">${md.phase}</p>` : ''}
        <h2 class="material-title">${fmt(md.name)}</h2>
        ${m.metaInCaption ? carousel(m.groups, mid, true, (Array.isArray(m.metaInCaption) ? m.metaInCaption : ['period', 'region']).map(k => md[k]).filter(Boolean).join(lang === 'ja' ? '　' : ' / ')) : carousel(m.groups, mid, false)}
        ${!m.metaInCaption && (md.type || md.fiber || md.period || md.region) ? `<div class="meta-section">${metaRows([[t.mType, md.type], [t.mFiber, md.fiber], [t.mPeriod, md.period], [t.mRegion, md.region]])}</div>` : ''}
        ${m.zoom ? `<div class="zoom-section"><p class="section-heading">${t.zoom}</p>${carousel(m.zoom, mid + '-zoom', true)}</div>` : ''}
        ${md.desc ? `<div class="fixed-topic">${paras(md.desc, 'fixed-topic-text')}${refHtml(m.refs)}</div>` : ''}
        ${topics ? `<div class="topics-section"><p class="section-heading">${t.topics}</p>${topics}</div>` : ''}
      </article>`;
  }).join('');
  return `
    <a class="back-link" href="#top">${t.back}</a>
    <div class="item-badge animate-in"><span class="badge-num">${circled(w.id)}</span></div>
    <h1 class="item-title animate-in delay-1">${fmt(d.title)}</h1>
    ${d.year ? `<p class="item-title-en animate-in delay-1">${d.year}</p>` : ''}
    <div class="meta-section animate-in delay-2">${metaRows([[t.mMaterial, d.material], [t.mPeriod, d.period]])}</div>
    <div class="fixed-topic animate-in delay-3">
      <p class="fixed-topic-label">${t.desc}</p>
      ${paras(d.desc, 'fixed-topic-text')}
    </div>
    ${mats ? `<div class="materials-section"><p class="section-heading">${t.materials}</p>${mats}</div>` : ''}`;
}

function setupCarousels(root) {
  root.querySelectorAll('.carousel').forEach(c => {
    const track = c.querySelector('.car-track');
    const n = track.children.length;
    const count = c.querySelector('.car-count');
    const prev = c.querySelector('[data-dir="-1"]'), next = c.querySelector('[data-dir="1"]');
    const dots = c.querySelectorAll('.car-dot'); const cap = c.querySelector(':scope > .car-cap');
    const cur = () => Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    const update = () => { const i = Math.min(n - 1, Math.max(0, active ? cur() : idx));
      if (count) count.textContent = `${i + 1} / ${n}`;
      if (prev) prev.disabled = i === 0; if (next) next.disabled = i === n - 1;
      dots.forEach((d, k) => d.classList.toggle('on', k === i));
      const src = track.children[i] && track.children[i].querySelector('.car-cap-src'); if (cap && src && cap.dataset.i !== String(i)) { cap.innerHTML = src.innerHTML; cap.dataset.i = String(i); } };
    // idx = the slide the viewer chose. Scrolls the viewer did not start (iOS re-snapping after a hidden panel opens or images load) are undone.
    let idx = 0, active = false, tm = 0;
    const clamp = i => Math.min(n - 1, Math.max(0, i));
    const hold = () => { active = true; clearTimeout(tm); tm = setTimeout(() => { active = false; }, 700); };
    const snapTo = () => { if (!track.clientWidth) return; const sb = track.style.scrollBehavior; track.style.scrollBehavior = 'auto'; track.scrollLeft = idx * track.clientWidth; track.style.scrollBehavior = sb; update(); };
    const go = i => { idx = clamp(i); hold(); track.scrollTo({ left: idx * track.clientWidth, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); };
    ['touchstart', 'pointerdown', 'wheel', 'keydown'].forEach(ev => track.addEventListener(ev, hold, { passive: true }));
    let raf = 0; track.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { if (active) { hold(); idx = clamp(cur()); update(); } else if (Math.abs(track.scrollLeft - idx * track.clientWidth) > 2) { snapTo(); } }); }, { passive: true });
    if (window.ResizeObserver) new ResizeObserver(snapTo).observe(track);
    track.querySelectorAll('img').forEach(im => im.addEventListener('load', () => { if (!active) snapTo(); }));
    c.resetSlides = () => { idx = 0; active = false; snapTo(); };
    c.addEventListener('click', e => {
      const b = e.target.closest('[data-dir]'); if (b) { go(cur() + Number(b.dataset.dir)); return; }
      const d = e.target.closest('[data-go]'); if (d) { go(Number(d.dataset.go)); return; }
      const im = e.target.closest('.car-img'); if (im) openLightbox(im.dataset.full, im.querySelector('img').alt);
    });
    track.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { e.preventDefault(); go(cur() + 1); } if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur() - 1); } });
    update();
  });
}

const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img');
function openLightbox(src, alt) { lbImg.src = src; lbImg.alt = alt || ''; lb.hidden = false; document.getElementById('lb-close').focus(); }
function closeLightbox() { lb.hidden = true; lbImg.removeAttribute('src'); }
lb.addEventListener('click', closeLightbox);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lb.hidden) closeLightbox(); });

function render() {
  const t = UI[lang], S = D.site[lang];
  document.documentElement.lang = lang;
  const bj = document.getElementById('btn-ja'), be = document.getElementById('btn-en');
  bj.classList.toggle('active', lang === 'ja'); be.classList.toggle('active', lang === 'en');
  if (CONF.mode === 'static') { bj.href = CONF.jaHref + location.hash; be.href = CONF.enHref + location.hash; }
  document.getElementById('h-sub').textContent = t.sub;
  document.getElementById('h-main').textContent = plain(S.main);
  document.getElementById('f-main').textContent = t.footer;
  const id = (location.hash.match(/^#work-(\d+)$/) || [])[1];
  const w = D.works.find(x => x.id === id);
  const content = document.getElementById('content');
  content.innerHTML = w ? renderWork(w, t) : renderTop(t, S);
  setupCarousels(content);
  document.title = w ? `${plain(w[lang].title)}｜${plain(S.main)}` : plain(S.main);
}
function setLang(l) { lang = l; try { localStorage.setItem('ishiki-lang', l); } catch (e) {} render(); }
if (CONF.mode === 'preview') {
  document.getElementById('btn-ja').addEventListener('click', e => { e.preventDefault(); setLang('ja'); });
  document.getElementById('btn-en').addEventListener('click', e => { e.preventDefault(); setLang('en'); });
}
document.getElementById('content').addEventListener('click', e => {
  const eb = e.target.closest('#essay-more-btn');
  if (eb) { const box = document.getElementById('essay-more'); const open = box.hidden; box.hidden = !open; eb.setAttribute('aria-expanded', open); eb.textContent = open ? (lang === 'ja' ? '閉じる' : 'Close') : (lang === 'ja' ? '続きを読む' : 'Read more'); return; }
  const mb = e.target.closest('#more-btn');
  if (mb) { const box = document.getElementById('intro-more'); const open = box.hidden; box.hidden = !open; mb.setAttribute('aria-expanded', open); mb.textContent = open ? UI[lang].less : UI[lang].more; return; }
  const trig = e.target.closest('.topic-trigger');
  if (trig && !trig.disabled) { const it = trig.closest('.topic-item'); const open = it.classList.toggle('open'); trig.setAttribute('aria-expanded', open); if (open) { it.querySelectorAll('.carousel').forEach(c => { if (c.resetSlides) { c.resetSlides(); setTimeout(c.resetSlides, 400); } }); } }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
</script>
